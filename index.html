<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    
<div class="relative grid min-h-screen grid-cols-[1fr_2.5rem_auto_2.5rem_1fr] grid-rows-[1fr_1px_auto_1px_1fr] bg-[url(https://siestasydney.com.au/img/siesta_banner.jpg)]">
    <div class="col-start-3 row-start-3 flex max-w-lg flex-col bg-gray-100 p-2 dark:bg-white/10">
      <div class="rounded-xl bg-white p-10 text-sm/7 text-gray-700 dark:bg-white-950 dark:text-gray-950">
        <img src="img/logo.png" class="mb-4 dark:hidden" alt="Tailwind Play" />
        <img src="img/logo.png" class="mb-4 not-dark:hidden" alt="Tailwind Play" />
        <div class="space-y-4">
            <p class="text-center">
                <span class="text-xl font-bold">Everything you need during your stay</span>
                <br>Wi-Fi • Building Access • House Rules • Safety Info
            </p>
          <ul class="space-y-3 dark:text-gray-100">
            <li class="flex">
                <button type="button" class="bg-green-700 hover:bg-emerald-900 w-full rounded-sm py-4 font-semibold">
                    <a href="">Guest Guide</a>
                </button>
            </li>
            </ul>
      
            <p class="text-center">Connect with us</p>
            <ul class="space-y-3 dark:text-gray-100">
            <li class="flex">
                <button type="button" class="bg-gray-500 hover:bg-gray-700 w-full rounded-sm py-2">
                    <a href="">Leave a Review</a>
                  </button>
            </li>
            <li class="flex">
                <button type="button" class="bg-gray-500 hover:bg-gray-700 w-full rounded-sm py-2">
                    <a href="">Instagram</a>
                  </button>
            </li>
            <li class="flex">
                <button type="button" class="bg-gray-500 hover:bg-gray-700 w-full rounded-sm py-2">
                    <a href="">Direct Booking</a>
                </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
